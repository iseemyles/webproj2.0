<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="stylesheet" href="changepass.css">
  </head>
  <body>
    
    <!-- Navbar base sa structural grid sa home.css -->
    <div class="header-nav">
      <div class="container">
        <div class="header-inner">
          <a class="brand" href="#">
            <img src="images/RAW.png" alt="logo" />
            <span>RAW</span>
          </a>

          <nav class="nav" id="nav">
            <ul>
              <li><a href="index.html">Home</a></li>
              <li><a href="work.html">Projects</a></li>
              <li><a href="about.html">About</a></li>
              <li><a href="contact.html">Contact</a></li>
            </ul>
          </nav>

          <button class="menu-toggle" id="menuToggle" aria-label="Open Menu">
            ☰
          </button>
        </div>
      </div>
    </div>

    <!-- Main Content Wrapper para ma-center ang card sa tibuok screen -->
    <main class="main-content">
      <div class="change-pass-container">
        <h2>Update Security</h2>
    
        <label for="txtNewPassword">Enter New Password:</label>
        <input type="password" id="txtNewPassword" placeholder="New Password" />

        <label for="txtConfirmPassword">Confirm Password:</label>
        <input type="password" id="txtConfirmPassword" placeholder="Confirm Password" />

        <!-- Primary Solid Gold Button -->
        <button type="button" class="btn-confirm" onclick="handlePasswordChange()">Confirm</button>
        
        <!-- Light Secondary Ghost Button 
        <a href="login.html" class="btn-back-signin">Back to Sign In</a>
        -->
      </div>
    </main>

    <script src="auth.js"></script>
  </body>
</html>
