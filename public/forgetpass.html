<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RAW - Forgot Password</title>
    <link rel="stylesheet" href="Calculator.css" />
    <link rel="stylesheet" href="home.css" />
  </head>
  <body>
    <!-- Premium Global Header Layout -->
    <header class="calc-header">
      <nav class="calc-nav">
        <div class="nav-left">RAW</div>
        <div class="nav-right">
        </div>
      </nav>
    </header>

    <main class="calc-main" style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
      <section style="width: 100%; max-width: 450px; background: var(--card, #0b0b0b); padding: 40px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
        <h1 style="font-size: 28px; margin-bottom: 10px; color: #fff;">Reset Your <br><span style="color: var(--gold, #ffd966);">Password</span></h1>
        <p style="color: #aaa; font-size: 14px; margin-bottom: 25px; line-height: 1.5;">
          Enter your registered email address below. We will send you a secure link to reset your account credentials.
        </p>

        <form id="forgotPasswordForm">
          <div style="margin-bottom: 20px;">
            <label for="emailInput" style="display: block; color: var(--muted, #cfc7be); font-size: 13px; text-transform: uppercase; margin-bottom: 8px;">Email Address</label>
            <input
              id="emailInput"
              class="input"
              type="email"
              required
              placeholder="e.g. name@example.com"
              style="width: 100%;"
            />
          </div>

          <!-- Live status notifications -->
          <div id="statusMessage" style="display: none; font-size: 14px; padding: 12px; border-radius: 6px; margin-bottom: 20px;"></div>

          <button id="submitBtn" type="submit" class="btn primary" style="width: 100%;">
            Send Reset Link
          </button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
          <a href="login.html" sty0le="color: var(--muted, #cfc7be); font-size: 14px; text-decoration: none;">&larr; Back to Home</a>
        </div>
      </section>
    </main>

    <script>
      document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('emailInput').value;
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');

        // UI Feedback loading state
        submitBtn.disabled = true;
        submitBtn.textContent = "Processing...";
        statusMessage.style.display = "none";

        try {
          const response = await fetch("/api/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
          });

          const data = await response.json();

          statusMessage.style.display = "block";
          if (response.ok) {
            statusMessage.style.background = "rgba(40, 167, 69, 0.1)";
            statusMessage.style.color = "#28a745";
            statusMessage.style.border = "1px solid rgba(40, 167, 69, 0.2)";
            statusMessage.textContent =
              data.message ||
              "A reset link has been generated in the server CLI.";
            document.getElementById("emailInput").value = "";
          } else {
            throw new Error(
              data.error || "An error occurred during submission.",
            );
          }
        } catch (error) {
          statusMessage.style.display = "block";
          statusMessage.style.background = "rgba(220, 53, 69, 0.1)";
          statusMessage.style.color = "#dc3545";
          statusMessage.style.border = "1px solid rgba(220, 53, 69, 0.2)";
          statusMessage.textContent = error.message;
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Send Reset Link";
        }
      });
    </script>
  </body>
</html>
