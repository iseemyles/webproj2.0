<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSS -->
    <link rel="stylesheet" href="home.css" />
    <title>Log In Account</title>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <!--Company Logo-->
        <a class="brand" href="#">
          <img src="images/RAW.png" alt="logo" />
          <span>RAW</span>
        </a>
      </div>
    </header>

    <main class="main">
      <div>
        <form
          onsubmit="
            event.preventDefault();
            handleLogin();
          "
          class="form"
        >
          <!-- KINI NGA HEADER ANG GIDUGANG -->
          <div class="form-header">
            <h2>Welcome to Arkitech</h2>
            <p>Sign in to continue</p>
          </div>

          <label for="txtEmail">Enter Email:</label>
          <input type="email" id="txtEmail" placeholder="Email" required />

          <label for="txtPassword">Enter Password:</label>
          <input type="password" id="txtPassword" placeholder="Password" required />

          <!-- Main Submit Button -->
          <button type="submit" class="btn-signin">Sign In</button>
          
          <!-- Footer Links sa sulod sa Form -->
          <div class="form-footer">
            <p>
              Don't have an account?
              <a href="registration.html">Sign up</a>
            </p>
            <!--
            <p>
              Forgot Password?
              <a href="changePass.html">Change password</a>
            </p>
            -->
          </div>
        </form>
      </div>
    </main>

    <script src="auth.js"></script>
  </body>
</html>
