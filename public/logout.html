<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="home.css" />
    <title>Log Out Account</title>
</head>

<body>
    <form class="logout-container">

            <div class="card-logout" style="text-align:center;">

                <h2 style="color:#000000;">Logging out...</h2>

                <p>You are being safely signed out of your account.</p>

                <div class="loader"></div>

            </div>

            <script>
                async function logoutUser() {

                    // Send logout request
                    await fetch("/api/logout", {
                        method: "POST",
                        credentials: "include"
                    });

                    // Wait 2 seconds
                    setTimeout(() => {

                        // Redirect to login page
                        window.location.href = "login.html";

                    }, 2000);
                }

                logoutUser();
            </script>
    </form>
</body>
</html>
