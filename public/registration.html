<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="home.css">
    <title>Account Registration</title>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="#">
                <img src="images/RAW.png" alt="logo"/>
                <span>RAW</span>
            </a>
            
            <nav class="nav">
                <ul>
                </ul>
            </nav> 
        </div>
    </header>

    <!-- KINI NGA PARTE ANG GI-TARONG -->
    <main class="main">
        <!-- Giusa nalang ang div wrapper ug form tag gamit ang class="form" -->
        <form class="form">
            <h2>Registration</h2>
            
            <div class="input">
                <label for="txtFirstName">Enter First Name:</label>
                <input type="text" id="txtFirstName" placeholder="First Name">
            </div>

            <div class="input">
                <label for="txtLastName">Enter Last Name:</label>
                <input type="text" id="txtLastName" placeholder="Last Name">
            </div>

            <div class="input">
                <label for="txtUsername">Enter Username:</label>
                <input type="text" id="txtUsername" placeholder="Username">
            </div>

            <div class="input">
                <label for="txtEmail">Enter Email:</label>
                <input type="text" id="txtEmail" placeholder="Email">
            </div>

            <div class="input">
                <label for="txtPassword">Password</label>
                <input type="password" id="txtPassword" placeholder="Password">
            </div>

            <div class="input">
                <label for="txtConfirmPassword">Confirm Password</label>
                <input type="password" id="txtConfirmPassword" placeholder="Confirm Password">
            </div>
                
            <button type="button" class="btn-signup" onclick="handleSignUp()">Register</button>
            
            <p class="signin-text">
                Already have an account? 
                <a href="login.html">Sign in</a>
            </p>
        </form>
    </main>

    <script src="auth.js"></script>
</body>
</html>
