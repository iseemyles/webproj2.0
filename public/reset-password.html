<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RAW - Reset Password</title>
    <link rel="stylesheet" href="calculator.css" />
    <link rel="stylesheet" href="home.css" />
  </head>
  <body>
    <header class="calc-header">
      <nav class="calc-nav">
        <div class="nav-left">RAW</div>
        <div class="nav-right"></div>
      </nav>
    </header>

    <main
      class="calc-main"
      style="
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 70vh;
      "
    >
      <section
        style="
          width: 100%;
          max-width: 450px;
          background: var(--card, #0b0b0b);
          padding: 40px;
          border-radius: 12px;
          border: 1px solid rgba(255, 255, 255, 0.05);
        "
      >
        <h1 style="font-size: 28px; margin-bottom: 10px; color: #fff">
          Set New <br /><span style="color: var(--gold, #ffd966)"
            >Password</span
          >
        </h1>
        <p
          style="
            color: #aaa;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
          "
        >
          Enter your new password below to regain access to your account.
        </p>

        <form id="resetPasswordForm">
          <div style="margin-bottom: 20px">
            <label
              for="newPassword"
              style="
                display: block;
                color: var(--muted, #cfc7be);
                font-size: 13px;
                text-transform: uppercase;
                margin-bottom: 8px;
              "
              >New Password</label
            >
            <input
              id="newPassword"
              class="input"
              type="password"
              required
              placeholder="••••••••"
              style="width: 100%"
            />
          </div>

          <div style="margin-bottom: 20px">
            <label
              for="confirmPassword"
              style="
                display: block;
                color: var(--muted, #cfc7be);
                font-size: 13px;
                text-transform: uppercase;
                margin-bottom: 8px;
              "
              >Confirm Password</label
            >
            <input
              id="confirmPassword"
              class="input"
              type="password"
              required
              placeholder="••••••••"
              style="width: 100%"
            />
          </div>

          <!-- Live status notifications -->
          <div
            id="statusMessage"
            style="
              display: none;
              font-size: 14px;
              padding: 12px;
              border-radius: 6px;
              margin-bottom: 20px;
            "
          ></div>

          <button
            id="submitBtn"
            type="submit"
            class="btn primary"
            style="width: 100%"
          >
            Reset Password
          </button>
        </form>

        <div style="text-align: center; margin-top: 20px">
          <a
            href="login.html"
            style="
              color: var(--muted, #cfc7be);
              font-size: 14px;
              text-decoration: none;
            "
            >&larr; Back to Login</a
          >
        </div>
      </section>
    </main>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token");

      if (!token) {
        const statusMessage = document.getElementById("statusMessage");
        statusMessage.style.display = "block";
        statusMessage.style.background = "rgba(220, 53, 69, 0.1)";
        statusMessage.style.color = "#dc3545";
        statusMessage.style.border = "1px solid rgba(220, 53, 69, 0.2)";
        statusMessage.textContent =
          "Invalid or missing reset token. Please request a new link.";
        document.getElementById("submitBtn").disabled = true;
      }

      document
        .getElementById("resetPasswordForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const newPassword = document.getElementById("newPassword").value;
          const confirmPassword =
            document.getElementById("confirmPassword").value;
          const submitBtn = document.getElementById("submitBtn");
          const statusMessage = document.getElementById("statusMessage");

          if (!newPassword || newPassword.trim() === "") {
            statusMessage.style.display = "block";
            statusMessage.style.background = "rgba(220, 53, 69, 0.1)";
            statusMessage.style.color = "#dc3545";
            statusMessage.style.border = "1px solid rgba(220, 53, 69, 0.2)";
            statusMessage.textContent = "Password cannot be empty!";
            return;
          }

          if (newPassword !== confirmPassword) {
            statusMessage.style.display = "block";
            statusMessage.style.background = "rgba(220, 53, 69, 0.1)";
            statusMessage.style.color = "#dc3545";
            statusMessage.style.border = "1px solid rgba(220, 53, 69, 0.2)";
            statusMessage.textContent = "Passwords do not match!";
            return;
          }

          // UI Feedback loading state
          submitBtn.disabled = true;
          submitBtn.textContent = "Updating...";
          statusMessage.style.display = "none";

          try {
            const response = await fetch("/api/reset-password", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token, newPassword }),
            });

            const data = await response.json();

            statusMessage.style.display = "block";
            if (response.ok) {
              statusMessage.style.background = "rgba(40, 167, 69, 0.1)";
              statusMessage.style.color = "#28a745";
              statusMessage.style.border = "1px solid rgba(40, 167, 69, 0.2)";
              statusMessage.textContent =
                data.message + ". Redirecting to login...";
              setTimeout(() => {
                window.location.href = "login.html";
              }, 2000);
            } else {
              throw new Error(
                data.error || "An error occurred during password reset.",
              );
            }
          } catch (error) {
            statusMessage.style.display = "block";
            statusMessage.style.background = "rgba(220, 53, 69, 0.1)";
            statusMessage.style.color = "#dc3545";
            statusMessage.style.border = "1px solid rgba(220, 53, 69, 0.2)";
            statusMessage.textContent = error.message;
            submitBtn.disabled = false;
            submitBtn.textContent = "Reset Password";
          }
        });
    </script>
  </body>
</html>
