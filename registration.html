<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- CSS -->
        <link rel="stylesheet" href="home.css">

        <title>Account Registration</title>
    </head>
    <body>
        <header class="site-header">
            <div>
                <!-- Company Logo -->
                <a class="brand" href="#">
                    <img src="images/RAW.png" alt="logo"/>
                    <span>RAW</span>
                </a>

                <!-- Navigation Bar -->
                 <nav class="nav" id="nav">
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="work.html">Projects</a></li>
                        <li><a href="about.html">About</a></li>
                        <li><a href="contact.html">Contact</a></li>
                 </nav>

                 <button class="menu-toggle" id="menuToggle" aria-label="Open Menu">☰</button>
            </div>

            <div>
                <form>
                    <!-- User Input Fields -->
                    <label for="txtFirstName">Enter First Name: </label>
                    <input type="text" placeholder="First Name">

                    <label for="txtLasstName">Enter Last Name: </label>
                    <input type="text" placeholder="Last Name">

                    <label for="txtUsername">Enter Username: </label>
                    <input type="text" placeholder="Username">

                    <label for="txtEmail">Enter Email:</label>
                    <input type="text" placeholder="Email">

                    <!-- Password -->
                    <label for="txtPassword">Password</label>
                    <input type="password" placeholder="Password">

                    <input for="txtConfirmPassword">
                    <input type="password" placeholder="Confirm Password">

                    <!-- Button -->
                    <button type="button" onclick="window.location.href='index.html'">Sign Up</button>
                    <p>
                        Already have an account?
                        <a href="login.html">Sign in</a>
                    </p>
                </form>
            </div>
        </header>
    </body>
</html>
